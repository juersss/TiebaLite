# jetifier 不可关(R4-F6 判定被发版实测推翻):依赖图存在传递依赖 com.android.support:
# support-compat:24.2.0,关 jetifier 后 release 期 checkReleaseDuplicateClasses 与
# androidx.core 1.18 撞类;debug 编译验证不覆盖该打包任务。保持 true。
android.enableJetifier=true
android.injected.testOnly=false
android.useAndroidX=true
kapt.verbose=true
kotlin.code.style=official
kotlin.parallel.tasks.in.project=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xmx4096m -Xms2048m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC \
--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED \
--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
org.gradle.parallel=true
# 历史曾长期 --no-daemon(疑"常驻 daemon 下 AAPT2 报错");当前环境(Gradle 8.14.5 / JDK 17)
# 实测 daemon 正常,故启用。异常时 ./gradlew.bat --stop 重置。
org.gradle.daemon=true
# 配置缓存:refreshVersions 0.60.6 + AGP 8.13.2 + KSP + Gradle 8.14.5 实测全兼容
# (compileDebugKotlin 二次构建配置期 <1s,cleanTest+test 全量绿)。
# 发版构建若遇 CC 报错,临时加 --no-configuration-cache 回退。
org.gradle.configuration-cache=true
# android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
#android.enableR8.fullMode=false