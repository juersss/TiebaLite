# jetifier 已关闭(2026-09-07,外部审查-依赖治理):全依赖图唯一 support 残留是
# XXPermissions POM 遗留的 support-fragment 声明(字节码零引用,已解包核验),
# 已在 app/build.gradle.kts exclude;Matisse(lwj1994 fork)为 androidx 原生。
# 验证口径:testDebugUnitTest + assembleDebug + assembleRelease(checkReleaseDuplicateClasses)全过
android.enableJetifier=false
android.injected.testOnly=false
android.useAndroidX=true
kapt.verbose=true
kotlin.code.style=official
kotlin.parallel.tasks.in.project=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xmx4096m -Xms2048m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC \
--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED \
--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
org.gradle.parallel=true
# 历史曾长期 --no-daemon(疑"常驻 daemon 下 AAPT2 报错");当前环境(Gradle 8.14.5 / JDK 17)
# 实测 daemon 正常,故启用。异常时 ./gradlew.bat --stop 重置。
org.gradle.daemon=true
# 配置缓存:refreshVersions 0.60.6 + AGP 8.13.2 + KSP + Gradle 8.14.5 实测全兼容
# (compileDebugKotlin 二次构建配置期 <1s,cleanTest+test 全量绿)。
# 发版构建若遇 CC 报错,临时加 --no-configuration-cache 回退。
org.gradle.configuration-cache=true
# android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
#android.enableR8.fullMode=false