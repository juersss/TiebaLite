name: Unit Tests

# 外部审查-7:此前唯一工作流 build.yml 仅由手动操作或 v* tag 触发,日常改动
# 不会自动跑单测,"132 passing" 徽章没有云端运行记录支撑。本工作流为
# 无需发布凭据的日常校验(push/PR),tag 发布仍走 build.yml。
on:
  workflow_dispatch:
  push:
    branches:
      - '4.0-dev'
      - 'master'
    tags-ignore:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "17"
          distribution: "zulu"

      - name: Set up Android SDK components
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: false

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports-${{ github.run_number }}
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
