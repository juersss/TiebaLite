name: Unit Tests & Lint

# 外部审查-7:此前唯一工作流 build.yml 仅由手动操作或 v* tag 触发,日常改动
# 不会自动跑单测。本工作流为无需发布凭据的日常校验(push/PR),运行 JVM 单测 +
# Android Lint(新增 Error 阻断,存量问题见 app/lint-baseline.xml),tag 发布仍走 build.yml。
on:
  workflow_dispatch:
  push:
    branches:
      - '4.0-dev'
      - 'master'
    tags-ignore:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "17"
          distribution: "zulu"

      - name: Set up Android SDK components
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: false

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # 外部审查-静态分析(第⑥项第一步):Android Lint 对基线之外的新增 Error
      # 阻断日常校验;存量 71 Error 挂账于 app/lint-baseline.xml,清偿后可
      # ./gradlew :app:updateLintBaseline 收缩基线
      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
